<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LingoTori · Learning</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="brand">LingoTori</span
        ><select id="locale" aria-label="Language">
          <option value="en">English</option>
          <option value="ko">한국어</option>
          <option value="ja">日本語</option>
        </select>
      </header>
      <h1 data-t="title">A little practice, every day.</h1>
      <p data-t="intro">Your words. Your local learning space.</p>
      <section id="login">
        <form id="connect">
          <label for="secret" data-t="secret">Server sync secret</label
          ><input id="secret" type="password" required autocomplete="off" /><button
            data-t="connect"
          >
            Unlock learning
          </button>
        </form>
      </section>
      <div id="workspace" hidden>
        <div class="toolbar">
          <button id="export" data-t="export">Export</button
          ><label class="file"
            ><span data-t="import">Import</span
            ><input id="import" type="file" accept="application/json" /></label
          ><button id="lock" data-t="lock">Lock</button>
        </div>
        <section>
          <h2 data-t="practice">Practice</h2>
          <p id="count"></p>
          <article id="card">
            <h3 id="term"></h3>
            <p id="context"></p>
            <button id="reveal" data-t="reveal">Show meaning</button>
            <p id="meaning" hidden></p>
            <div id="ratings" hidden>
              <button data-rating="again" data-t="again">Again</button
              ><button data-rating="hard" data-t="hard">Hard</button
              ><button data-rating="good" data-t="good">Good</button
              ><button data-rating="easy" data-t="easy">Easy</button>
            </div>
          </article>
        </section>
        <section>
          <h2 data-t="add">Save a word</h2>
          <form id="note">
            <label for="new-term" data-t="term">Word or phrase</label
            ><input id="new-term" maxlength="500" required /><label
              for="new-meaning"
              data-t="meaning"
              >Meaning</label
            ><textarea id="new-meaning" maxlength="5000"></textarea
            ><label for="new-context" data-t="context">Context</label
            ><textarea id="new-context" maxlength="10000"></textarea
            ><label for="new-language" data-t="language">Language</label
            ><input id="new-language" maxlength="40" placeholder="en / ko / ja" /><button
              data-t="save"
            >
              Save
            </button>
          </form>
        </section>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="retry" hidden data-t="retry">Retry pending save</button>
      <footer data-t="footer">
        Simple interval practice · Local server · Keep your export as a backup
      </footer>
    </main>
    <script type="module" src="/app.mjs"></script>
  </body>
</html>
