name: Validate before merge

# Run manually as the final PR merge gate. Repository Actions remain disabled until enabled.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SKIP_FREE_API: "true"

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.10.1"
          run_install: false
          cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare extension types
        run: pnpm exec wxt prepare

      - name: Check formatting
        run: pnpm fmt:check

      - name: Check types and lint
        run: pnpm type-check

      - name: Run offline tests
        run: pnpm test

      - name: Build Chrome MV3
        run: pnpm build

      - name: Build Firefox MV3
        run: pnpm build:firefox
